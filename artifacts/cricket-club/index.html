<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Neutral placeholders. The real per-tenant title is set client-side by
         BrandProvider (document.title = brand.name). TODO(phase-1): server-render
         per-tenant OG/twitter tags at the hosting layer for link previews/SEO;
         not built here (no SSR yet). -->
    <title>Ovation</title>
    <meta name="description" content="Ovation — white-label cricket stats and history." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Ovation" />
    <meta property="og:description" content="Ovation — white-label cricket stats and history." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ovation" />
    <meta name="twitter:description" content="Ovation — white-label cricket stats and history." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Anti-flash: set the resolved light/dark class before first paint, so
      // there's no flicker between "no class" and the correct mode once React
      // mounts (mirrors ThemeProvider's own resolution logic in theme-context.tsx
      // — keep the two in sync if this logic ever changes).
      (function () {
        try {
          var stored = localStorage.getItem("ovation-theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          // localStorage/matchMedia unavailable — leave the light default.
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- The decorative families for the Social Studio's selectable card fonts
         (Cinzel, EB Garamond, Inter, Oswald, Space Mono) are NOT loaded here —
         they'd block first paint for every public visitor but are only needed
         by the admin card editors/exports. They're injected on demand by
         ensureCardFontsLoaded() in src/lib/card-fonts.ts. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
