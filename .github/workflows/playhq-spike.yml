name: PlayHQ headless spike (S1)

# Throwaway spike for docs/plans/2026-10-01-001-feat-playhq-scheduled-sync-plan.md (S1).
# Answers one question: can headless Chromium on a GitHub-hosted runner drive the PlayHQ
# harness from a play.cricket.com.au page? Read-only against PlayHQ; no secrets; writes
# nothing but the job log and step summary. Delete once S1 is decided.
#
# Runs on pushes that touch the spike, and by hand (re-run the job on a later day for the
# "three runs on different days" pass criterion).
on:
  push:
    paths:
      - ".github/workflows/playhq-spike.yml"
      - "scripts/spikes/playhq-headless.mjs"
  workflow_dispatch:
    inputs:
      org_id:
        description: "PlayHQ organisation GUID (default Halls Head)"
        required: false

permissions:
  contents: read

concurrency:
  group: playhq-spike
  cancel-in-progress: false

jobs:
  spike:
    name: Headless harness (${{ matrix.ua }} UA)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # default = the honest HeadlessChrome UA; desktop = same browser, "Chrome" UA.
        # Tells us whether a block (if any) keys on the UA string.
        ua: [default, desktop]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install puppeteer-core outside the workspace
        run: |
          mkdir -p "$RUNNER_TEMP/spike"
          cd "$RUNNER_TEMP/spike"
          npm init -y >/dev/null
          npm install --no-audit --no-fund puppeteer-core@25

      - name: Run spike
        working-directory: ${{ runner.temp }}/spike
        env:
          CHROME_PATH: /usr/bin/google-chrome
          HARNESS_PATH: ${{ github.workspace }}/.claude/skills/playcricket-stats-scraper/harness.js
          ORG_ID: ${{ inputs.org_id }}
          UA_MODE: ${{ matrix.ua }}
        run: |
          google-chrome --version
          curl -s https://api.ipify.org && echo " (runner egress IP)"
          node "$GITHUB_WORKSPACE/scripts/spikes/playhq-headless.mjs"
